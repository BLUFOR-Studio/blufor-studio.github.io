name: Build and deploy
on:
  push:
    branches:
      - main
  schedule:
    # 17 = 17:00 (5 PM) UTC+2
    - cron: '0 17 * * *'
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      force_renotify:
        description: "Re-send Discord notifications for all currently-published posts (ignores prior notification history)"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Define tool versions
      DART_SASS_VERSION: 1.102.0
      GO_VERSION: 1.26.6
      HUGO_VERSION: 0.165.0
      NODE_VERSION: 24.19.0

      # Set the build time zone
      TZ: Europe/Spain
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          echo "Logging tool versions..."
          command -v sass &> /dev/null && echo "Dart Sass: $(sass --version)" || echo "Dart Sass: not installed"
          command -v go &> /dev/null && echo "Go: $(go version)" || echo "Go: not installed"
          command -v hugo &> /dev/null && echo "Hugo: $(hugo version)" || echo "Hugo: not installed"
          command -v node &> /dev/null && echo "Node.js: $(node --version)" || echo "Node.js: not installed"

      - name: Configure Git
        run: |
          echo "Configuring Git..."
          git config --global core.quotepath false

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Install Node.js dependencies
        run: |
          if [[ -f package-lock.json ]]; then
            echo "Installing Node.js dependencies..."
            npm ci
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache restore (notified posts state)
        id: notify-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: .cache/notified-posts.json
          key: notified-posts-${{ github.run_id }}
          restore-keys: notified-posts-

      - name: Find newly-public posts
        run: |
          BASE_URL=$(grep -oP "^baseURL\s*=\s*['\"]\K[^'\"]+" hugo.toml)
          FORCE_FLAG=""
          if [[ "${{ inputs.force_renotify }}" == "true" ]]; then
            echo "force_renotify requested: ignoring notification history for this run."
            FORCE_FLAG="--force"
          fi
          python3 scripts/find_new_posts.py \
            --content-dir content/posts \
            --authors-file data/en/authors.toml \
            --base-url "$BASE_URL" \
            --state-file .cache/notified-posts.json \
            --out new-posts.json \
            $FORCE_FLAG
          cat new-posts.json

      - name: Cache save (notified posts state)
        uses: actions/cache/save@v6
        with:
          path: .cache/notified-posts.json
          key: ${{ steps.notify-cache-restore.outputs.cache-primary-key }}

      - name: Send Discord notification
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_NEWS_ROLE_ID: ${{ vars.DISCORD_NEWS_ROLE_ID }}
          DISCORD_RESEARCH_ROLE_ID: ${{ vars.DISCORD_RESEARCH_ROLE_ID }}
        run: |
          python3 scripts/notify_discord.py \
            --posts new-posts.json \
            --webhook-url "$DISCORD_WEBHOOK_URL" \
            --news-role-id "$DISCORD_NEWS_ROLE_ID" \
            --research-role-id "$DISCORD_RESEARCH_ROLE_ID"