# Multi-author data file for the "authors" taxonomy.
#
# Each top-level key below (e.g. [lord-pump]) is the AUTHOR ID you will
# reference from a post's front matter, e.g.:
#
#   authors = ["lord-pump"]                 # single author
#   authors = ["lord-pump", "theinfinityglitch"]   # multiple authors on one post
#   authors = ["blufor-studio"]             # the whole-team "author"
#
# Fields per author (all optional except name):
#   name    - display name
#   image   - path relative to /assets, same convention as pump_goober.png
#   headline- short role/title shown under the name
#   bio     - longer bio text
#   links   - list of { platform = "url" } tables, same syntax as
#             params.author.links in config/_default/languages.en.toml
#
# Keep the ids lowercase, hyphenated, no spaces - they become part of the URL at /authors/<id>/.

[lord-pump]
  name = "{Lord Pump}"
  image = "img/authors/pump_goober.png"
  headline = "Director, JOAT"
  bio = "Hey there, dear reader! I'm Lord Pump, the Director of our small indie team called BLUFOR Studio. We are a passionate bunch of individuals who like to dream big, and find ways to make said dreams true! Out of that shared enthusiasm, we joined forces to start active development for OPFOR on 2026, and we've created this small website to host our most recent news regarding our projects and team. We sincerely hope you have a nice time reading through our articles as you do playing our games!"
  # links = [
  #   { twitter = "https://twitter.com/username" },
  #   { github = "https://github.com/username" },
  # ]

