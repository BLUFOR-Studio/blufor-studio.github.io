# Multi-author data file for the "authors" taxonomy.
#
# Each top-level key below (e.g. [lord-pump]) is the AUTHOR ID you will
# reference from a post's front matter, e.g.:
#
#   authors = ["lord-pump"]                 # single author
#   authors = ["lord-pump", "theinfinityglitch"]   # multiple authors on one post
#   authors = ["blufor-studio"]             # the whole-team "author"
#
# Fields per author (all optional except name):
#   name    - display name
#   image   - path relative to /assets, same convention as pump_goober.png
#   headline- short role/title shown under the name
#   bio     - longer bio text
#   links   - list of { platform = "url" } tables, same syntax as
#             params.author.links in config/_default/languages.en.toml
#
# Keep the ids lowercase, hyphenated, no spaces - they become part of the URL at /authors/<id>/.

[lord-pump]
name = "{Lord Pump}"
image = "img/authors/pump_pfp.png"
headline = "Director, JOAT"
bio = "Hey there, dear reader! I'm Lord Pump, the Head Director of BLUFOR Studios. I'm a jack-of-all-trades who likes to delve into the nitty-gritty details of everything and learn how stuff works! I usually handle the announcements and big update posts on the blog, as well as some special posts from time to time."
# links = [
#   { twitter = "https://twitter.com/username" },
#   { github = "https://github.com/username" },
# ]

[theinfinityglitch]
name = "The Infinity Glitch (Alan)"
image = "img/authors/alan_pfp.jpg"
headline = "Programmer/Tooling"
bio = "Heya! I'm Alan, a Programmer and maybe tooling developer, and also a JOAT of BLUFOR Studios. I'm bad at math, so I'm far away of algorithms so far. I'm here to work with the game code when possible, but mostly to interact with the low level tooling systems including the engine. I'm 18 years old, and I've been coding for the last 8 years btw. o7"
links = [
  { email = "theinfinityglitch@gmail.com" },
  { github = "https://github.com/theinfinityglitch" },
  { gitlab = "https://gitlab.com/theinfinityglitch" },
  { instagram = "https://instagram.com/theinfinityglitch" },
  { linkedin = "https://linkedin.com/in/theinfinityglitch" },
  { pinterest = "https://pinterest.com/theinfinityglitch" },
  { reddit = "https://reddit.com/user/TheInfinityGlitch" },
  { twitter = "https://twitter.com/ErrorNineNine" },
  { youtube = "https://youtube.com/@theinfinityglitch" },
]

