[params.author]
  name = "{Lord Pump}"
  image = "img/pump_goober.png"
  headline = "BLUFOR Studio's Director, JOAT"
  bio = "Hey there, dear reader! I'm Lord Pump, the Director of our small indie team called BLUFOR Studio. We are a passionate bunch of individuals who like to dream big, and find ways to make said dreams true! Out of that shared enthusiasm, we joined forces to start active development for OPFOR on 2026, and we've created this small website to host our most recent news regarding our projects and team. We sincerely hope you have a nice time reading through our articles as you do playing our games!"
